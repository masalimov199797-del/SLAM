<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SLAM</title>
<meta name="description" content="Ежесменная оценка рисков SLAM — ТОО «Востокцветмет»">
<meta name="theme-color" content="#1C4FA0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLAM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<script src="config.js"></script>
<style>
/* Layout: phone-first app shell (560px) for the worker, wide dashboard (1120px) for staff */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E9EFF7; --line:#D6E0EC;
  --ink:#0E1C30; --muted:#566781; --blue:#1C4FA0; --blue-ink:#FFFFFF; --sky:#E3EDFA;
  --go:#1B8048; --go-bg:#E2F3E8; --warn:#A86200; --warn-bg:#FCEFD9; --stop:#B8322A; --stop-bg:#F9E3E1;
  --grey-cell:#C9D2DE;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111F36; --sunk:#0D192C; --line:#22344F;
  --ink:#E4ECF7; --muted:#93A4BE; --blue:#6E9CEB; --blue-ink:#071225; --sky:#182C4C;
  --go:#4CC27F; --go-bg:#12301F; --warn:#F0A63C; --warn-bg:#33240C; --stop:#F07A70; --stop-bg:#3A1714;
  --grey-cell:#3A4A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111F36; --sunk:#0D192C; --line:#22344F;
  --ink:#E4ECF7; --muted:#93A4BE; --blue:#6E9CEB; --blue-ink:#071225; --sky:#182C4C;
  --go:#4CC27F; --go-bg:#12301F; --warn:#F0A63C; --warn-bg:#33240C; --stop:#F07A70; --stop-bg:#3A1714;
  --grey-cell:#3A4A63; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;color:#14336B;border-bottom:3px solid #1C4FA0}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#14336B;padding:0;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .sep{width:1px;height:28px;background:#C9D6EA}
.brand > span{text-align:left;min-width:0}
.brand b{display:block}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.06em}
.brand small{display:block;font-size:11px;color:#5A6E8F;letter-spacing:.02em;text-align:left;line-height:1.2;white-space:nowrap}
.sync-s{display:none}
@media (max-width:430px){.brand{gap:8px}.brand img{height:24px}.brand .sep{height:24px}.brand b{font-size:17px}.brand small{font-size:10.5px}.sync-l{display:none}.sync-s{display:inline}.sync{padding:6px 9px}}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;background:#E8F0FB;border:0;color:#14336B;border-radius:999px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#1B8048;flex:none}
.dot.off{background:#D98300}.dot.busy{background:#1C4FA0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
main{margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:560px}.wide{max-width:1120px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.ghost{background:none;border-color:transparent;color:var(--blue);padding-inline:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{min-height:64px;font-size:18px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:44px}
textarea.input{min-height:72px;resize:vertical}
.fixed-val{padding:11px 12px;border-radius:10px;background:var(--sunk);border:1px dashed var(--line)}
.err{color:var(--stop);font-size:13px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.go{background:var(--go-bg);color:var(--go)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.stop{background:var(--stop-bg);color:var(--stop)}.pill.info{background:var(--sky);color:var(--blue)}.pill.wait{background:var(--sunk);color:var(--muted)}
/* hero for worker */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.slam-word{display:flex;gap:6px;flex-wrap:nowrap}
.slam-word span{display:flex;flex-direction:column;align-items:flex-start;background:var(--sky);border-radius:10px;padding:8px 9px;flex:1 1 0;min-width:0}
.slam-word b{font-family:var(--f-display);font-size:20px;color:var(--blue)}
.slam-word i{font-style:normal;font-size:11px;color:var(--muted);line-height:1.2}
@media (max-width:400px){.slam-word{gap:5px}.slam-word span{padding:7px 6px}.slam-word b{font-size:18px}.slam-word i{font-size:10px}}
/* notebook-style cover */
.cover{background:#fff;color:#14336B;border-radius:16px;border:1px solid var(--line);padding:22px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cover-kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5A6E8F}
.cover-mark{display:flex;flex-direction:column;align-items:center;gap:2px}
.cover-mark img{width:96px;height:96px}
.cover-mark b{font-family:var(--f-display);font-size:40px;letter-spacing:.08em;color:#1C4FA0;line-height:1}
.cover-sub{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#14336B}
.cover-values{font-size:11.5px;color:#5A6E8F;line-height:1.6;max-width:42ch}
.cover-values span+span::before{content:" | ";color:#B9C7DD}
.cover-logo{height:34px;width:auto;margin-top:4px}
.cover.compact{padding:16px;gap:8px}.cover.compact .cover-mark img{width:64px;height:64px}.cover.compact .cover-mark b{font-size:30px}
/* steps */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.q{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.q-head{display:flex;gap:10px}
.q-num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.q ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;position:relative}
.yn button.grey{background:linear-gradient(var(--sunk),var(--sunk))}
.yn button.grey::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:3px;background:var(--grey-cell)}
.yn button.sel.ok{background:var(--go);border-color:var(--go);color:#fff}
.yn button.sel.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.yn button.sel::after{display:none}
.q.flag{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--grey-cell);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;min-height:38px}
.chip.sel{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.hz{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:start}
.hz-h{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hz-h span:first-child{color:var(--ink)}.hz-h span:nth-child(2){color:var(--muted)}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
@media (max-width:440px){.hz,.hz-h{grid-template-columns:1fr auto}.hz .hz-c{grid-column:1/2}.hz-h span:nth-child(2){display:none}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.add-photo{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--blue);font-weight:600;font-size:13px;background:var(--surface);cursor:pointer;text-align:center;padding:6px}
.add-photo input{display:none}
.verdict{border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.verdict.go{background:var(--go-bg);color:var(--go)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.stop{background:var(--stop-bg);color:var(--stop)}
.verdict b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.verdict p{color:var(--ink)}
.sticky-nav{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.sticky-nav .btn{flex:1}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.feedback{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--sky);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* dashboard */
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.warn b{color:var(--warn)}.kpi.stop b{color:var(--stop)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden}
.hbar .a{background:var(--blue)}.hbar .w{background:var(--warn)}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.trend{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.trend .bar{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;background:var(--sunk);min-height:2px}
.trend .bar i{display:block;background:var(--blue)}.trend .bar i.w{background:var(--warn)}
.trend small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.trend .v{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:2px;background:var(--blue)}.keys i.w{background:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.num{font-variant-numeric:tabular-nums}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--warn-bg);color:var(--warn);font-weight:600}
.banner.info{background:var(--sky);color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:18px}}
.ans{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.ans:first-child{border-top:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;flex:1}
.seg button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.footer-link{text-align:center;padding-top:8px}
.rep-cards{display:none;flex-direction:column;gap:10px}
.rep-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rep-card.total{background:var(--sky);border-color:transparent}
.rep-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.rep-grid span{color:var(--muted)}.rep-grid b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:640px){.rep-table{display:none}.rep-cards{display:flex}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:420px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.gitem{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--sunk);aspect-ratio:1;max-width:100%;cursor:pointer;text-align:left}
.gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gitem .gcap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(5,12,24,.82));color:#fff;font-size:12px;line-height:1.3}
.gitem .gcap b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .gst{position:absolute;top:6px;left:6px}
.gload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
.viewer{background:var(--bg);width:100%;max-width:720px;max-height:96vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.viewer{border-radius:18px}}
.vimg{position:relative;border-radius:12px;overflow:hidden;background:#000;display:grid;place-items:center;min-height:240px}
.vimg img{max-width:100%;max-height:62vh;object-fit:contain;display:block}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;display:grid;place-items:center}
.vnav.prev{left:8px}.vnav.next{right:8px}
.vcount{position:absolute;top:8px;right:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:999px}
.vmeta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.vmeta dt{color:var(--muted)}.vmeta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.shift{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px}
.shift.go{background:var(--go-bg)}.shift.warn{background:var(--warn-bg)}.shift.stop{background:var(--stop-bg)}
.shift-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.shift.go .shift-ic{background:var(--go)}.shift.warn .shift-ic{background:var(--warn)}.shift.stop .shift-ic{background:var(--stop)}
.shift-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.shift-t b{font-size:15px;color:var(--ink)}
.shift-t span{font-size:13px;color:var(--muted)}
.shift-t .meta{font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.shift.go .meta{color:var(--go)}.shift.warn .meta{color:var(--warn)}.shift.stop .meta{color:var(--stop)}
.rule{display:flex;flex-direction:column;gap:8px}
.rule-head{display:flex;align-items:center;gap:8px}
.rule-ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.rule p.rt{font-size:15px;line-height:1.45}
.staff-bar{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:12px;padding:10px 14px;min-height:46px;font-weight:600;text-align:left}
.staff-bar svg{flex:none}
.staff-bar .lbl{flex:1 1 auto;min-width:0;font-size:14px}
.staff-bar .chev{flex:none;color:var(--muted);font-size:20px;line-height:1}
.bellbtn{margin-left:auto;position:relative;width:40px;height:40px;border-radius:50%;border:0;background:#E8F0FB;color:#14336B;display:grid;place-items:center;flex:none}
.bellbtn + .sync{margin-left:0}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#B8322A;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.banner.bell{background:var(--stop-bg);color:var(--stop)}
.bell-ic{font-size:12px}
.notice{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;max-width:min(380px,calc(100% - 32px));display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--stop);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(10,20,40,.22)}
.notice-dot{width:10px;height:10px;border-radius:50%;background:var(--stop);margin-top:6px;flex:none}
</style>

</head>

const getQueue = () => store.get("queue", []);
const setQueue = (q) => { if (!store.set("queue", q)) toast("Память телефона заполнена: удалите лишние фото"); };
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]); }

async function trySync() {
  if (S.syncing) return;
  const q = getQueue();
  if (!q.length || !db) { renderTop(); return; }
  S.syncing = true; renderTop();
  try {
    for (const item of q) {
      for (const p of item.photos) {
        await withTimeout(db.doc("photos/" + p.id).set({ id: p.id, reportId: item.report.id, data: p.data, createdAt: item.report.createdAt }), 25000);
      }
      await withTimeout(db.doc("reports/" + item.report.id).set(Object.assign({}, item.report, { syncedAt: new Date().toISOString() })), 25000);
      setQueue(getQueue().filter(x => x.report.id !== item.report.id));
    }
    S.online = true; S.lastErr = "";
  } catch (e) {
    S.online = false;
    if (e && e.code === "resource-exhausted") S.lastErr = "Превышен лимит базы, сообщите администратору";
    else if (e && e.code === "permission-denied") S.lastErr = "Нет прав на отправку. Сообщите администратору";
  }
  S.syncing = false; renderTop();
  if (S.view === "home" || S.view === "done") render();
}
window.addEventListener("online", () => { S.online = true; trySync(); });
window.addEventListener("offline", () => { S.online = false; renderTop(); });

var CFG = self.SLAM_CONFIG || {};

var pollers = new Set();
function runAllPollers() { pollers.forEach(fn => fn()); }
async function sbFetch(path, opt = {}) {
  let r;
  try {
    r = await fetch(SB_URL + "/rest/v1/" + path, Object.assign({}, opt, { headers: Object.assign({ apikey: SB_KEY, "Content-Type": "application/json" }, opt.headers || {}) }));
  } catch (e) { throw { code: "unavailable", message: String(e) }; }
  if (!r.ok) { const txt = await r.text().catch(() => ""); throw { code: r.status === 401 || r.status === 403 ? "permission-denied" : "http-" + r.status, message: txt }; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

function poll(fetcher, cb, err, ms = 15000) {
  let busy = false;
  const run = async () => { if (busy) return; busy = true; try { cb(await fetcher()); } catch (e) { err && err(e); } busy = false; };
  pollers.add(run); run(); setInterval(run, ms);

/* ===== Push-уведомления (Web Push) ===== */
function pushSupported() { return "Notification" in window && "serviceWorker" in navigator && "PushManager" in window; }
function b64urlToBytes(s) { const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function registerPush(interactive) {
  if (!pushSupported()) { if (interactive) toast(isIOS() ? "На iPhone сначала добавьте SLAM на экран «Домой» и откройте оттуда" : "Этот браузер не поддерживает уведомления"); return; }
  if (!db || !CFG.vapidPublicKey) { if (interactive) toast("Уведомления не настроены"); return; }
  try {
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { if (interactive) toast("Уведомления запрещены в настройках телефона"); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(CFG.vapidPublicKey) });
    const json = sub.toJSON();
    await db.doc("leads/" + json.endpoint).set({ endpoint: json.endpoint, site: S.staff.site, sub: json });
    store.set("pushKey", json.endpoint); S.pushOn = true;
    if (interactive) toast("Уведомления включены"); render();
  } catch (e) { if (interactive) toast("Не удалось включить уведомления"); }
}

  try { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.frequency.setValueAtTime(660, audioCtx.currentTime + 0.15); o.stop(audioCtx.currentTime + 0.32); } catch (e) {}
}

/* ===== Фото: сжатие перед сохранением ===== */
function compress(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let max = 1280, q = 0.72, out = "";
        for (let i = 0; i < 6; i++) {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 190000) break;
          max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.06);
        }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}

/* Смены: 08:00–20:00 дневная, 20:00–08:00 ночная */
function shiftInfo(now = new Date()) {
  const h = now.getHours(), start = new Date(now);
  start.setMinutes(0, 0, 0);
  if (h >= 8 && h < 20) { start.setHours(8); return { name: "Дневная смена", hours: "08:00–20:00", start }; }
  if (h < 8) start.setDate(start.getDate() - 1);
  start.setHours(20);
  return { name: "Ночная смена", hours: "20:00–08:00", start };
}
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function shiftCard(list) {
  const now = new Date(), sh = shiftInfo(now);
  const last = list.find(r => new Date(r.createdAt) >= sh.start);
  const meta = `${sh.name} · ${WD[now.getDay()]}, ${now.getDate()} ${MON[now.getMonth()]}`;
  let cls = "warn", ic = "!", title = "SLAM на эту смену ещё не пройден", sub = "Пройдите оценку рисков перед началом работы";
  if (last) {
    const t = fmtTime(last.createdAt);
    if (last.outcome === "go") { cls = "go"; ic = "✓"; title = "SLAM пройден в " + t; sub = "Можно приступать к заданию"; }
    else if (last.outcome === "warn") { cls = "warn"; ic = "!"; title = "SLAM пройден в " + t; sub = "Обратитесь к непосредственному руководителю"; }
    else { cls = "stop"; ic = "✕"; title = "Работа остановлена в " + t; sub = "Не приступайте к заданию без решения руководителя"; }
  }
  return `<div class="shift ${cls}" role="status"><span class="shift-ic" aria-hidden="true">${ic}</span><div class="shift-t"><span class="meta">${esc(meta)}</span><b>${esc(title)}</b><span>${esc(sub)}</span></div></div>`;
}

let demoCache = null;
function demoData() {
  if (demoCache) return demoCache;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const hz = [["Движущийся подвижной состав", "Сигналист, ограждение места работ"], ["Скользкое покрытие на путях", "Обувь с противоскользящей подошвой"], ["Подъём шпал вручную", "Работа звеном, захваты"], ["Шум от тепловоза", "Противошумные наушники"], ["Искры при сварке", ""], ["Обрыв троса при погрузке", "Осмотр стропов перед работой"]];
  const out = [];
  for (let i = 0; i < 140; i++) {
    const d = new Date(); d.setDate(d.getDate() - Math.floor(rnd() * 14)); d.setHours(7 + Math.floor(rnd() * 3), Math.floor(rnd() * 60));
    const site = pick(SITES).id; const answers = {}; QUESTIONS.forEach(q => answers[q.n] = q.bad === "yes" ? (rnd() < .3 ? "yes" : "no") : (rnd() < .06 ? "no" : "yes"));
    const r = { id: "demo" + i, createdAt: d.toISOString(), workerId: "dw" + Math.floor(rnd() * 36), worker: { lastName: "Работник " + (1 + Math.floor(rnd() * 36)), firstName: "(пример)", position: pick(POSITIONS.slice(0, 7)) },
      site, workplace: pick(DEFAULT_DIR.workplaces), task: pick(DEFAULT_DIR.tasks), answers, energies: [pick(ENERGIES).id], hazards: [], remarks: "", photoIds: [], photoCount: 0, review: null };
    r.flags = flags(answers);
    if (r.flags.length) { const h = pick(hz); r.hazards = [{ h: h[0], c: h[1] }]; }
    if (rnd() < .15) { r.remarks = pick(["Не работает освещение на стрелочном переводе", "Разрушен настил на переезде", "Нет аптечки в бытовке", "Нужна замена рукавиц на складе"]); r.photoCount = 1; r.photoIds = ["demoP" + i]; }
    r.outcome = [1,2,3,4].some(n => answers[n] === "no") ? "stop" : (r.flags.length || r.hazards.some(h => !h.c)) ? "warn" : "go";
    if (hasRemark(r) && rnd() < .7) {
      const stt = pick(["fixed", "fixed", "inwork", "notfixed", "escalated"]);
      const h = { status: stt, by: "Руководитель (пример)", at: d.toISOString(), comment: { fixed: "Устранено в течение смены.", inwork: "Заявка на материалы подана.", notfixed: "Нужна замена оборудования, ждём поставку.", escalated: "Требуется решение начальника цеха." }[stt] };
      if (stt === "escalated") h.level = "Начальник цеха";
      if (stt === "inwork" || stt === "notfixed") { const dd = new Date(d); dd.setDate(dd.getDate() + 10); h.due = dayKey(dd); }
      r.review = Object.assign({ history: [h] }, h);
    }
    out.push(r);
  }
  return demoCache = out.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}

      store.set("reviewer", name);
      const h = { status: v, by: name, at: new Date().toISOString() };
      if (comment) h.comment = comment;
      if (due && v !== "fixed") h.due = due;
      if (v === "escalated") h.level = level;
      const prev = (r.review && r.review.history) || [];
      const review = Object.assign({}, r.review || {}, h, { history: prev.concat(h) });
      if (v !== "escalated" && !h.level) delete review.level;
      if (S.demo) { const d = demoData().find(x => x.id === r.id); if (d) d.review = review; toast("Статус «" + ST[v].l + "» (пример, в базу не записан)"); S.detail = null; render(); break; }
      t.disabled = true;
      try { await withTimeout(db.doc("reports/" + r.id).update({ review }), 20000); toast("Статус «" + ST[v].l + "» отправлен работнику"); S.detail = null; render(); }
      catch (e) { t.disabled = false; toast(e.code === "timeout" ? "Нет связи. Попробуйте позже" : "Не удалось сохранить решение"); }
      break; }
    case "remarkFilter": S.remarkFilter = t.dataset.v; render(); break;
    case "enablePush": unlockAudio(); registerPush(true); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "hideInstall": store.set("hideInstall", true); render(); break;
    case "exportReport": exportReport(); break;
    case "saveDir": case "saveDirAll": {
      if (!db) { toast("Нет связи с базой"); break; }
      const lines = (id) => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);
      const entry = { workplaces: lines("#d-wp"), tasks: lines("#d-tk") };
      const sites = Object.assign({}, (S.dir && S.dir.sites) || {});
      (a === "saveDirAll" ? SITES.map(s => s.id) : [S.dirSite || SITES[0].id]).forEach(id => sites[id] = entry);
      try { await withTimeout(db.doc("config/directory").set({ sites, updatedAt: new Date().toISOString() }), 20000); toast("Списки сохранены"); }
      catch (e) { toast(e.code === "permission-denied" ? "Нет прав на изменение справочников" : "Не удалось сохранить"); }
      break; }
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.detail) { S.detail = null; renderLayer(); }
  else if (ev.key === "Escape" && S.photoK != null) { S.photoK = null; renderLayer(); }
  if (S.photoK != null && !S.detail && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) { const n = (S.galleryItems || []).length; if (n) { S.photoK = (S.photoK + (ev.key === "ArrowRight" ? 1 : -1) + n) % n; renderLayer(); } }
  if (ev.key === "Enter" && ev.target.matches("tr[data-a]")) ev.target.click();
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.bind && S.draft) {
    const k = t.dataset.bind;
    S.draft[k] = t.type === "checkbox" ? t.checked : t.value;
    if (t.tagName === "SELECT") { render(); }
    saveDraftSoon();
  } else if (t.dataset.hz != null && S.draft) {
    S.draft.hazards[+t.dataset.hz][t.dataset.k] = t.value; saveDraftSoon();
  }
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.id === "w-photo" && t.files && t.files[0]) {
    try { const data = await compress(t.files[0]); S.draft.photos.push({ id: uid("p"), data }); saveDraft(); render(); }
    catch (e) { toast("Не удалось прочитать фото"); }
  }
  if (t.dataset.f) { S[t.dataset.f] = t.value; render(); }
  if (t.dataset.a2 === "dirSite") { S.dirSite = t.value; render(); }
  if (t.dataset.bind === "confirm" && S.draft) { S.draft.confirm = t.checked; saveDraft(); }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  navigator.serviceWorker.addEventListener("message", (e) => {
    const d = e.data || {}; if (d.type === "open-report" && d.reportId) openReportWhenReady(d.reportId);
  });
}
function openReportWhenReady(id, tries = 0) {
  const r = allReports().find(x => x.id === id);
  if (r && S.staff) { S.view = "admin"; S.tab = "remarks"; S.detail = r; markSeen(id); render(); return; }
  if (tries < 20) setTimeout(() => openReportWhenReady(id, tries + 1), 500);
}
(function deepLink() { const m = location.hash.match(/^#report-([A-Za-z0-9]+)$/); if (m) { history.replaceState(null, "", location.pathname); openReportWhenReady(m[1]); } })();
render();
</script>
